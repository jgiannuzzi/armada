services:
  kubernetes:
    image: bsycorp/kind:v1.17.10
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10080/kubernetes-ready"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  setup-namespace:
    image: bsycorp/kind:v1.17.10
    entrypoint: ["sh", "-c", "until wget -q -O /dev/null http://kubernetes:10080/kubernetes-ready; do sleep 1; done; wget -q -O - http://kubernetes:10080/config | sed 's/localhost/kubernetes/' > /tmp/kubeconfig; KUBECONFIG=/tmp/kubeconfig kubectl apply -f /setup/namespace-with-anonymous-user.yaml"]
    volumes:
      - .:/setup
    depends_on:
      - kubernetes
